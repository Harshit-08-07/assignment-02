<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="1; url=http://localhost:3000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EARTHLY — Opening Localhost:3000</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF7F2;
      color: #202421;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #E5DFD4;
      max-width: 480px;
    }
    .badge {
      background: #5B755A;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 24px;
      color: #1D2B1F;
    }
    p {
      color: #5C635E;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #1D2B1F;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2F4232;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Next.js Web Application</div>
    <h1>Redirecting to EARTHLY...</h1>
    <p>
      Next.js applications run on a Node.js server rather than VS Code's static Live Server.
      <br><br>
      Redirecting you to <strong>http://localhost:3000</strong>...
    </p>
    <a href="http://localhost:3000" class="btn">Open EARTHLY (localhost:3000)</a>
  </div>
</body>
</html>
